nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin: ['http://localhost:5175']
        allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: []
        max_age: 3600

    paths:
        '^/api/':
            allow_origin: ['http://localhost:5175']
            allow_headers: ['Content-Type', 'Authorization']
            allow_methods: ['GET', 'POST','PUT', 'PATCH', 'OPTIONS']
            max_age: 3600